<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Murat Özcan</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0b0d10;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
  .panel {
    position: fixed; padding: 10px 12px; white-space: pre;
    background: #0b0d10cc; border: 1px solid #2a3038; border-radius: 4px;
    color: #d8dee9; backdrop-filter: blur(4px);
    font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #hud { top: 10px; left: 10px; pointer-events: none; }
  #tests { bottom: 10px; left: 10px; max-width: 62ch; white-space: pre-wrap; }
  /* Clears the settings button, which owns the top-right corner. */
  #help { top: 54px; right: 10px; pointer-events: none; transition: opacity .6s; }
  #help.seen { opacity: 0; }
  b { color: #7fd3f7; font-weight: 600; }
  .pass { color: #7ee787; } .fail { color: #ff7b72; }
  [hidden] { display: none !important; }

  #crosshair {
    position: fixed; left: 50%; top: 50%;
    width: 5px; height: 5px; margin: -2.5px 0 0 -2.5px;
    border-radius: 50%; background: #e9eef3b8;
    box-shadow: 0 0 4px #000a; pointer-events: none; z-index: 4;
  }

  .proximity-panel {
    position: fixed; left: 50%; bottom: 8vh; transform: translateX(-50%);
    /* Content-driven up to the cap, so this only ever removes line breaks —
       44ch was wrapping station copy into a tall column in the middle of the
       screen. The vw term keeps it from spanning an ultrawide monitor. */
    width: max-content; max-width: min(68ch, 72vw); padding: 14px 18px; text-align: center;
    pointer-events: none; visibility: hidden;
    background: #0b0d10d9; border: 1px solid #39424e; border-radius: 5px;
    backdrop-filter: blur(6px);
    font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #c9d3dd;
  }
  .proximity-panel h2 {
    margin: 0 0 4px; font-size: 13px; letter-spacing: .14em;
    text-transform: uppercase; color: #7fd3f7; font-weight: 600;
  }
  .proximity-panel.untitled h2 { display: none; }
  .proximity-panel p { margin: 0; }
  .proximity-panel a {
    color: #7fd3f7; pointer-events: auto; text-decoration: none;
    border-bottom: 1px solid #7fd3f766;
  }
  /* Sits under the crosshair, where the eye already is when you are aiming. */
  .aim-prompt {
    position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%);
    padding: 5px 11px; pointer-events: none; white-space: nowrap;
    background: #0b0d10d9; border: 1px solid #39424e; border-radius: 4px;
    font: 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
    letter-spacing: .1em; color: #e2c98d; opacity: 0;
    transition: opacity .12s ease-out;
  }

  /* ----------------------------------------------------------- loading
     Static markup on purpose. The bundle is ~680 kB and the world is built
     synchronously once it parses, so anything created from JS would appear
     only after the wait it is meant to cover. */
  #loading {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 26px;
    background: #0b0d10; color: #d8dee9;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    transition: opacity .5s ease-out;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading-name {
    font-size: 15px; letter-spacing: .34em; text-transform: uppercase;
    color: #e9eef3; padding-left: .34em;
  }
  #loading-bar {
    width: min(260px, 56vw); height: 2px; background: #222932; overflow: hidden;
  }
  /* scaleX, not width: the world is built on the main thread in long
     synchronous blocks, and a width transition needs that thread to animate.
     A transform runs on the compositor, so the bar keeps moving through a
     stage instead of freezing until it ends. */
  #loading-fill {
    width: 100%; height: 100%; background: #7fd3f7;
    transform: scaleX(0); transform-origin: left center;
    transition: transform .45s ease-out;
  }
  /* Until the bundle parses there is no progress to report, and a bar frozen
     at zero reads as a hang. The sweep is dropped the moment a real stage
     lands. */
  #loading-bar.indeterminate #loading-fill { display: none; }
  #loading-bar.indeterminate::after {
    content: ''; display: block; height: 100%; width: 34%;
    background: #7fd3f7; animation: sweep 1.15s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(294%); }
  }
  #loading-status { color: #66707a; letter-spacing: .12em; min-height: 1.6em; }
  #loading-hint { color: #444d57; max-width: 34ch; text-align: center; }

  /* -------------------------------------------------------- settings */
  #settings-btn, #fullscreen-btn {
    position: fixed; top: 10px; z-index: 12;
    width: 34px; height: 34px; padding: 0; cursor: pointer;
    display: grid; place-items: center;
    background: #0b0d10cc; border: 1px solid #2a3038; border-radius: 4px;
    color: #98a3ae; backdrop-filter: blur(4px);
  }
  #settings-btn { right: 10px; }
  #fullscreen-btn { right: 52px; }
  #settings-btn:hover, #fullscreen-btn:hover { color: #7fd3f7; border-color: #39424e; }
  #settings-btn svg, #fullscreen-btn svg { width: 17px; height: 17px; display: block; }

  #settings {
    position: fixed; inset: 0; z-index: 15;
    display: grid; place-items: center;
    background: #05070ac4; backdrop-filter: blur(3px);
    font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #settings-card {
    width: min(420px, calc(100vw - 32px));
    max-height: min(560px, calc(100dvh - 32px));
    overflow-y: auto; overscroll-behavior: contain;
    background: #0d1015; border: 1px solid #2a3038; border-radius: 6px;
    color: #c9d3dd;
  }
  #settings h2 {
    margin: 0; padding: 15px 18px; font-size: 12px; font-weight: 600;
    letter-spacing: .18em; text-transform: uppercase; color: #7fd3f7;
    border-bottom: 1px solid #1c222a;
    display: flex; align-items: center; justify-content: space-between;
  }
  #settings-close {
    background: none; border: none; color: #66707a; cursor: pointer;
    font: inherit; font-size: 17px; line-height: 1; padding: 0 2px;
  }
  #settings-close:hover { color: #ff7b72; }
  .set-group {
    padding: 6px 18px 12px;
    border-bottom: 1px solid #1c222a;
  }
  .set-group:last-child { border-bottom: none; }
  .set-group > h3 {
    margin: 12px 0 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .16em; text-transform: uppercase; color: #59636e;
  }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 7px 0;
  }
  .set-row label { color: #b3bec9; flex: 1; cursor: pointer; }
  .set-row .set-value {
    color: #7fd3f7; font-variant-numeric: tabular-nums;
    min-width: 4ch; text-align: right;
  }
  .set-seg { display: flex; border: 1px solid #2a3038; border-radius: 4px; overflow: hidden; }
  .set-seg button {
    background: none; border: none; cursor: pointer; font: inherit;
    padding: 4px 11px; color: #6d7883;
  }
  .set-seg button + button { border-left: 1px solid #2a3038; }
  .set-seg button:hover { color: #b3bec9; }
  .set-seg button.active { background: #7fd3f71c; color: #7fd3f7; font-weight: 600; }
  .set-row input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 140px; height: 2px; background: #2a3038; outline: none;
  }
  .set-row input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #7fd3f7; cursor: pointer;
  }
  .set-row input[type=range]::-moz-range-thumb {
    width: 13px; height: 13px; border: none; border-radius: 50%;
    background: #7fd3f7; cursor: pointer;
  }
  .set-switch {
    width: 38px; height: 20px; flex: none; padding: 0; cursor: pointer;
    background: #20262e; border: 1px solid #2a3038; border-radius: 10px;
    position: relative; transition: background .15s;
  }
  .set-switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 14px; height: 14px; border-radius: 50%;
    background: #6d7883; transition: transform .15s, background .15s;
  }
  .set-switch[aria-checked=true] { background: #7fd3f72e; border-color: #7fd3f766; }
  .set-switch[aria-checked=true]::after { transform: translateX(18px); background: #7fd3f7; }
  .set-note { margin: 2px 0 0; color: #4e5761; font-size: 11px; line-height: 1.5; }
  #settings-reset {
    margin: 14px 18px 18px; padding: 7px 12px; cursor: pointer;
    background: none; border: 1px solid #2a3038; border-radius: 4px;
    color: #6d7883; font: inherit;
  }
  #settings-reset:hover { color: #ff7b72; border-color: #ff7b7255; }

  /* ---------------------------------------------------------- touch
     Twin-stick. The joystick base is placed where the thumb lands rather
     than pinned to a corner, which is the difference between reachable and
     not across the range of hand sizes and phone widths. */
  #touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #stick {
    position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px;
    border: 1px solid #e9eef33d; border-radius: 50%;
    background: #0b0d1052; opacity: 0; transition: opacity .18s;
  }
  #stick.live { opacity: 1; }
  #stick-knob {
    position: absolute; left: 50%; top: 50%;
    width: 46px; height: 46px; margin: -23px 0 0 -23px;
    border-radius: 50%; background: #e9eef370;
    border: 1px solid #e9eef38a;
  }
  /* Hold to sprint. Deliberately NOT pointer-events:auto — the canvas owns
     the gesture, so the same thumb that presses it can slide off and keep
     looking around instead of being trapped on a button. */
  #sprint {
    position: absolute; right: 22px; bottom: 22px;
    width: 66px; height: 66px; display: grid; place-items: center;
    border: 1px solid #e9eef33d; border-radius: 50%;
    background: #0b0d1052; color: #e9eef3a8;
  }
  #sprint svg { width: 24px; height: 24px; }
  #sprint.held { border-color: #e2c98d; background: #e2c98d33; color: #e2c98d; }

  /* ------------------------------------------------------ orientation */
  #rotate {
    position: fixed; inset: 0; z-index: 18;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: #0b0d10f2; color: #98a3ae; text-align: center; padding: 24px;
    font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  #rotate svg { width: 46px; height: 46px; color: #7fd3f7; }
  #rotate-dismiss {
    margin-top: 6px; padding: 8px 16px; cursor: pointer;
    background: none; border: 1px solid #2a3038; border-radius: 4px;
    color: #6d7883; font: inherit;
  }

  /* Coarse pointers get bigger hit targets and less chrome — the HUD and
     the test dump are unreadable at this width and are off by default. */
  @media (pointer: coarse) {
    #settings-btn, #fullscreen-btn { width: 40px; height: 40px; }
    #fullscreen-btn { right: 58px; }
    canvas { cursor: default; }

    /* A phone in landscape is ~750 CSS px wide against a desktop's 1400+, so
       type sized in px lands at roughly twice the share of the screen. These
       are the desktop sizes taken back down to the same proportion — NOT a
       function of the resolution setting, which scales the drawing buffer and
       cannot touch anything in the DOM. */
    .panel { font-size: 10px; padding: 7px 9px; }
    .proximity-panel { font-size: 11px; padding: 7px 12px; }
    .proximity-panel h2 { font-size: 10px; }
    .aim-prompt { font-size: 10px; padding: 4px 9px; }
    #settings { font-size: 12px; }
    #rotate { font-size: 12px; }
    #help { top: 60px; }
  }
  /* Short viewport — a phone in landscape. There is not enough vertical room
     for a bottom-anchored proximity panel and a centred aim prompt to both
     stay clear of each other, so the prompt moves ABOVE the crosshair and the
     panel hugs the bottom edge. They grow away from one another instead of
     toward the same band of screen.

     Layout only. The type scale belongs to the coarse-pointer block above —
     a short window on a desktop is still read from desktop distance. */
  @media (max-height: 560px) {
    #tests { display: none; }
    .aim-prompt { top: auto; bottom: calc(50% + 22px); }
    .proximity-panel { bottom: 10px; line-height: 1.5; }
    .proximity-panel h2 { margin-bottom: 2px; }
  }
  @media (max-height: 460px) {
    #sprint { width: 56px; height: 56px; right: 16px; bottom: 16px; }
  }
  @media (pointer: coarse) and (max-height: 560px) {
    /* 216px keeps the panel clear of the sprint button. */
    .proximity-panel { max-width: min(92ch, 100vw - 216px); line-height: 1.4; }
    .proximity-panel h2 { margin-bottom: 0; }
  }
  @media (pointer: coarse) and (orientation: portrait) {
    /* 100px lifts the panel over the sprint button. */
    .proximity-panel { max-width: calc(100vw - 50px); bottom: 100px; line-height: 1.4; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="crosshair"></div>
  <div class="panel" id="hud"></div>
  <div class="panel" id="tests"></div>
  <div class="panel" id="help"></div>

  <div id="touch" hidden>
    <div id="stick"><div id="stick-knob"></div></div>
    <div id="sprint" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6l6 6-6 6"></path><path d="M13 6l6 6-6 6"></path>
      </svg>
    </div>
  </div>

  <button id="fullscreen-btn" type="button" aria-label="Fullscreen" hidden>
    <svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 9V4h5"></path><path d="M20 9V4h-5"></path>
      <path d="M4 15v5h5"></path><path d="M20 15v5h-5"></path>
    </svg>
    <svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
      <path d="M9 4v5H4"></path><path d="M15 4v5h5"></path>
      <path d="M9 20v-5H4"></path><path d="M15 20v-5h5"></path>
    </svg>
  </button>

  <button id="settings-btn" type="button" aria-label="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <div id="settings" hidden>
    <div id="settings-card">
      <h2><span id="settings-title">Settings</span><button id="settings-close" type="button" aria-label="Close">&times;</button></h2>
      <div id="settings-body"></div>
      <button id="settings-reset" type="button">Reset</button>
    </div>
  </div>

  <div id="rotate" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="2" y="7" width="20" height="10" rx="2"></rect>
      <path d="M9 3.5A6 6 0 0 1 15 3.5"></path>
      <path d="M14 1.8 15.2 3.6 13.3 4.6"></path>
    </svg>
    <p id="rotate-text">Best viewed on a desktop. On a phone, best in landscape. Turn it sideways.</p>
    <button id="rotate-dismiss" type="button">Continue anyway</button>
  </div>

  <div id="loading">
    <div id="loading-name">Murat Özcan</div>
    <div id="loading-bar" class="indeterminate"><div id="loading-fill"></div></div>
    <!-- Static text, replaced by the first build stage. Without it the screen
         reads as a bare name and a dead bar for the whole bundle download,
         which is the longest part of the wait and the only part JS cannot
         narrate. -->
    <div id="loading-status">loading…</div>
    <div id="loading-hint"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
